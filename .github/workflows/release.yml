name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/thiagosctg/linkdrop

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  metadata:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate version and extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", tag):
              raise SystemExit("Expected a version tag such as v0.1.0")
          version = tag[1:]
          package = json.loads(Path("package.json").read_text())
          lock = json.loads(Path("package-lock.json").read_text())
          if any(v != version for v in [package["version"], lock["version"], lock["packages"][""]["version"]]):
              raise SystemExit("Tag, package.json and package-lock.json versions must agree")
          changelog = Path("CHANGELOG.md").read_text()
          heading = f"## [{version}]"
          sections = changelog.split(heading, 1)
          if len(sections) != 2:
              raise SystemExit(f"Missing changelog section {heading}")
          notes = sections[1].split("\n", 1)[1].split("\n## ", 1)[0].strip()
          if not notes:
              raise SystemExit("Release notes must not be empty")
          notes += f"\n\n### Installation\n\n- Container: `docker run -d -p 47821:47821 --name linkdrop ghcr.io/thiagosctg/linkdrop:{tag}`\n- Binaries: download and extract the archive for your OS and architecture below.\n- Open `http://localhost:47821`; use the computer's LAN IP when pairing a phone.\n- Verify downloads against `checksums.txt`. See the README for platform instructions.\n"
          Path("release-notes.md").write_text(notes)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  binaries:
    name: Build binaries
    needs: [checks, metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build frontend
        run: npm ci && npm run build
      - name: Build and package binaries
        run: |
          mkdir -p release
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            dir="build/${os}_${arch}"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "$dir/linkdrop$ext" ./cmd/linkdrop
            cp LICENSE README.md "$dir/"
            if [ "$os" = windows ]; then
              (cd "$dir" && zip -q "../../release/linkdrop_${os}_${arch}.zip" linkdrop.exe LICENSE README.md)
            else
              tar -czf "release/linkdrop_${os}_${arch}.tar.gz" -C "$dir" linkdrop LICENSE README.md
            fi
          done
          (cd release && sha256sum * > checksums.txt)
      - name: Smoke test Linux binary
        run: |
          build/linux_amd64/linkdrop &
          pid=$!
          trap 'kill "$pid"' EXIT
          for _ in $(seq 1 20); do
            if build/linux_amd64/linkdrop healthcheck; then
              curl -fsS http://localhost:47821/ | grep -q '<html'
              exit 0
            fi
            sleep 1
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: release/*
          if-no-files-found: error

  image:
    name: Publish multi-arch image
    needs: [checks, metadata]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}

  publish:
    name: Publish GitHub release
    needs: [metadata, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .
      - name: Verify checksums
        run: cd release && sha256sum -c checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=()
          [[ "$RELEASE_TAG" == *-* ]] && args+=(--prerelease)
          gh release create "$RELEASE_TAG" release/* --title "LinkDrop $RELEASE_TAG" \
            --notes-file release-notes.md --verify-tag "${args[@]}"
