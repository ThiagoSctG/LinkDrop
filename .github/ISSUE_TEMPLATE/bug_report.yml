name: Bug report
description: Report incorrect, reproducible behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve LinkDrop. Do not use this form for security vulnerabilities. Issues can be written in English or Portuguese.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Click...\n3. See..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: LinkDrop version or commit, how you run it (Docker, binary), browser, OS and device.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs without sensitive data, screenshots or anything else that helps.
