name: Relatar um bug
description: Informe um comportamento incorreto e reproduzível.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Obrigado por ajudar a melhorar o LinkDrop. Não use este formulário para vulnerabilidades de segurança.
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: O que aconteceu e o que você esperava que acontecesse?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
      placeholder: "1. Abra...\n2. Clique...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      description: Navegador, sistema operacional, dispositivo e versão ou commit, quando aplicável.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Logs sem dados sensíveis, capturas de tela ou outras informações úteis.
